name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master", "*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Debug Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Build Release APK
      run: gradle assembleRelease || gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoWebBrowser-APK
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: AutoWebBrowser-APK

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app-debug.apk
          app-release.apk
        body: |
          ### FourgeAI Labs AutoWeb Browser Release
          - Version: 1.02.00
          - Android Auto projected car screen support.
          - Built automatically via GitHub Actions.
          - Licensed under FourgeAI Labs Proprietary Software License Version 1.0.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
